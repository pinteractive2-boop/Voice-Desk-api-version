document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\u002Fdiv><\u002Fsc-for><div style=\"display:{{ k.noRes }};font-size:13px;color:#9a9aa5\">Nothing matches.<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:{{ k.whyDisp }};font-size:12px;color:#dc2626;margin-top:8px;font-weight:500\">Needs attention: {{ k.why }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <button sc-camel-on-click=\"{{ commit }}\" style=\"display:{{ commitDisp }};width:100%;border:0;background:#7c5cf0;color:#fff;border-radius:12px;padding:13px;font-size:14px;font-weight:500;opacity:{{ commitOp }}\">{{ commitLabel }}<\u002Fbutton>\n          <\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:{{ vhistDisp }};margin-top:20px\"><div style=\"font-size:15px;font-weight:500;margin-bottom:8px\">Voice history<\u002Fdiv>\n            <sc-for list=\"{{ vhist }}\" as=\"h\" hint-placeholder-count=\"3\"><div class=\"vd-card\" sc-camel-on-click=\"{{ h.reuse }}\" style=\"padding:10px 14px;margin-bottom:6px;cursor:pointer;font-size:12.5px\"><div>{{ h.text }}<\u002Fdiv><div style=\"color:#9a9aa5;font-size:11px;margin-top:2px\">{{ h.when }} · {{ h.n }} item(s) · tap to reuse<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isTeam }}\" hint-placeholder-val=\"{{ false }}\"><div>\n      <div style=\"display:flex;margin-bottom:14px\"><div style=\"flex:1;font-size:13px;color:#6b6b76\">Spoken names (aliases) are matched against active members only.<\u002Fdiv><button sc-camel-on-click=\"{{ addMember }}\" style=\"display:{{ addMemDisp }};border:0;background:#7c5cf0;color:#fff;border-radius:11px;padding:10px 16px;font-size:13px\">+ Add member<\u002Fbutton><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px\">\n        <sc-for list=\"{{ team }}\" as=\"m\" hint-placeholder-count=\"6\">\n          <div class=\"vd-card\" style=\"padding:16px;opacity:{{ m.op }}\">\n            <div style=\"display:flex;gap:12px;align-items:center\"><div style=\"width:44px;height:44px;border-radius:50%;background:{{ m.av }};color:#fff;display:grid;place-items:center;font-weight:600\">{{ m.ini }}<\u002Fdiv><div style=\"flex:1;min-width:0\"><div style=\"font-weight:600;font-size:14.5px\">{{ m.name }}<\u002Fdiv><div style=\"font-size:12px;color:#9a9aa5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ m.desig }} · {{ m.dept }}<\u002Fdiv><\u002Fdiv><span style=\"font-size:11px;color:{{ m.sd }}\">{{ m.sl }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#6b6b76;margin-top:10px\">Voice: {{ m.aliases }}<\u002Fdiv>\n            <div style=\"display:{{ m.dupDisp }};font-size:11.5px;color:#92400e;background:#fffbeb;border-radius:8px;padding:5px 8px;margin-top:6px\">Shared alias “{{ m.dupes }}”. Voice will ask which person.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0;text-align:center;font-size:11px;color:#9a9aa5\"><div><div style=\"font-size:18px;color:#17171c\">{{ m.st.active }}<\u002Fdiv>Open<\u002Fdiv><div><div style=\"font-size:18px;color:#dc2626\">{{ m.st.over }}<\u002Fdiv>Overdue<\u002Fdiv><div><div style=\"font-size:18px;color:#16a34a\">{{ m.st.done }}<\u002Fdiv>Done<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"flex:1;height:6px;border-radius:3px;background:#eee\"><div style=\"height:6px;border-radius:3px;background:#84cc16;width:{{ m.pctW }}\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:12px\">{{ m.st.pct }}%<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-top:12px\"><button sc-camel-on-click=\"{{ m.open }}\" style=\"flex:1;border:1px solid #e4e4ea;background:#fff;border-radius:9px;padding:7px;font-size:12px\">Edit profile<\u002Fbutton><button sc-camel-on-click=\"{{ m.tasks }}\" style=\"flex:1;border:1px solid #e4e4ea;background:#fff;border-radius:9px;padding:7px;font-size:12px\">View tasks<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ isProj }}\" hint-placeholder-val=\"{{ false }}\"><div>\n      <div style=\"display:flex;margin-bottom:14px\"><div style=\"flex:1;font-size:13px;color:#6b6b76\">Progress is task-count based: completed / active tasks.<\u002Fdiv><button sc-camel-on-click=\"{{ addProj }}\" style=\"display:{{ addProjDisp }};border:0;background:#7c5cf0;color:#fff;border-radius:11px;padding:10px 16px;font-size:13px\">+ New project<\u002Fbutton><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px\">\n        <sc-for list=\"{{ projFull }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div class=\"vd-card\" style=\"padding:18px\">\n            <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:30px;height:22px;border-radius:6px;background:{{ p.col }}\"><\u002Fdiv><div style=\"flex:1;font-size:16px;font-weight:600\">{{ p.name }}<\u002Fdiv><span style=\"font-size:11px;color:#6b6b76\">{{ p.status }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6b6b76;margin:8px 0 12px;min-height:18px\">{{ p.desc }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#9a9aa5;display:flex;justify-content:space-between\"><span>Owner {{ p.owner }}<\u002Fspan><span>Target {{ p.target }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;margin:10px 0\"><div style=\"flex:1;height:7px;border-radius:4px;background:#eee\"><div style=\"height:7px;border-radius:4px;background:{{ p.col }};width:{{ p.pctW }}\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:13px;font-weight:500\">{{ p.pct }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#9a9aa5\">{{ p.d }} of {{ p.count }} tasks completed (task-count method)<\u002Fdiv><div style=\"font-size:11.5px;color:#6b6b76;margin-top:4px\">{{ p.nextMs }}<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-top:12px\"><button sc-camel-on-click=\"{{ p.open }}\" style=\"flex:1;border:1px solid #e4e4ea;background:#fff;border-radius:9px;padding:7px;font-size:12px\">Edit<\u002Fbutton><button sc-camel-on-click=\"{{ p.view }}\" style=\"flex:1;border:1px solid #e4e4ea;background:#fff;border-radius:9px;padding:7px;font-size:12px\">View tasks<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ isAct }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"vd-3\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start\">\n      <div class=\"vd-card\" style=\"padding:16px;grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;align-items:center\"><div style=\"flex:1;min-width:240px;font-size:13px;line-height:1.6\"><b>{{ dayTxt }}<\u002Fb><br><span style=\"color:#55555f\">{{ wkTxt }}<\u002Fspan><\u002Fdiv><button sc-camel-on-click=\"{{ sendDay }}\" style=\"border:1px solid #e4e4ea;background:#fff;border-radius:10px;padding:8px 12px;font-size:12px\">Send daily to me<\u002Fbutton><button sc-camel-on-click=\"{{ sendWk }}\" style=\"border:1px solid #e4e4ea;background:#fff;border-radius:10px;padding:8px 12px;font-size:12px\">Send weekly to me<\u002Fbutton><\u002Fdiv>\n      <div class=\"vd-card\" style=\"padding:16px\"><div style=\"display:flex;margin-bottom:8px\"><div style=\"flex:1;font-size:15px;font-weight:500\">Notifications<\u002Fdiv><a sc-camel-on-click=\"{{ markAll }}\" style=\"font-size:12px;cursor:pointer\">Mark all read<\u002Fa><\u002Fdiv>\n        <sc-for list=\"{{ myN }}\" as=\"n\" hint-placeholder-count=\"3\"><div sc-camel-on-click=\"{{ n.mark }}\" style=\"padding:9px 8px;border-top:1px solid #f0f0f3;font-size:12.5px;background:{{ n.bg }};border-radius:8px;cursor:pointer\"><div>{{ n.text }}<\u002Fdiv><div style=\"font-size:11px;color:#9a9aa5\">{{ n.when }} · {{ n.kind }} · {{ n.del }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n        <div style=\"display:{{ noN }};font-size:12.5px;color:#9a9aa5\">No notifications yet. Assignments to you appear here.<\u002Fdiv><\u002Fdiv>\n      <div class=\"vd-card\" style=\"padding:16px\"><div style=\"font-size:15px;font-weight:500;margin-bottom:8px\">Due soon and overdue<\u002Fdiv>\n        <sc-for list=\"{{ rem }}\" as=\"t\" hint-placeholder-count=\"3\"><div style=\"padding:9px 0;border-top:1px solid #f0f0f3;font-size:12.5px;display:flex;gap:8px;align-items:center\"><div style=\"flex:1;min-width:0\"><div style=\"font-weight:500\">{{ t.title }}<\u002Fdiv><div style=\"color:{{ t.dueFg }};font-size:11.5px\">{{ t.dueLabel }} · {{ t.assigneeName }}<\u002Fdiv><\u002Fdiv><button sc-camel-on-click=\"{{ t.send }}\" style=\"border:1px solid #e4e4ea;background:#fff;border-radius:8px;padding:5px 9px;font-size:11.5px\">Remind<\u002Fbutton><\u002Fdiv><\u002Fsc-for>\n        <div style=\"display:{{ noRem }};font-size:12.5px;color:#9a9aa5\">Nothing due in the next 2 days.<\u002Fdiv><\u002Fdiv>\n      <div class=\"vd-card\" style=\"padding:16px\"><div style=\"font-size:15px;font-weight:500;margin-bottom:8px\">Task change history<\u002Fdiv>\n        <sc-for list=\"{{ log }}\" as=\"a\" hint-placeholder-count=\"5\"><div style=\"padding:8px 0;border-top:1px solid #f0f0f3;font-size:12.5px\"><b>{{ a.by }}<\u002Fb> {{ a.text }}<div style=\"font-size:11px;color:#9a9aa5\">{{ a.when }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ isRep }}\" hint-placeholder-val=\"{{ false }}\"><div>\n      <div style=\"display:flex;gap:10px;align-items:center;margin-bottom:14px\"><span style=\"font-size:13px;color:#6b6b76\">Period<\u002Fspan><sc-raw-select class=\"vd-in\" value=\"{{ rp }}\" sc-camel-on-change=\"{{ setRp }}\" style=\"width:auto\"><option value=\"all\">All time<\u002Foption><option value=\"week\">Last 7 days<\u002Foption><option value=\"month\">Last 30 days<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n      <div class=\"vd-2\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start\">\n        <div class=\"vd-card\" style=\"padding:18px\"><div style=\"font-size:15px;font-weight:500\">Completion by member<\u002Fdiv><div style=\"font-size:11.5px;color:#9a9aa5;margin:2px 0 8px\">Completed / assigned tasks. Cancelled, draft and archived are excluded.<\u002Fdiv>\n          <sc-for list=\"{{ repRows }}\" as=\"r\" hint-placeholder-count=\"4\"><div style=\"display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px\"><span style=\"width:26px;height:26px;border-radius:50%;background:{{ r.av }};color:#fff;font-size:10px;display:grid;place-items:center\">{{ r.ini }}<\u002Fspan><span style=\"width:110px\">{{ r.name }}<\u002Fspan><div style=\"flex:1;height:7px;border-radius:4px;background:#eee\"><div style=\"height:7px;border-radius:4px;background:#84cc16;width:{{ r.pctW }}\"><\u002Fdiv><\u002Fdiv><span style=\"width:70px;text-align:right;font-size:12px\">{{ r.st.done }}/{{ r.st.total }} · {{ r.st.pct }}%<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div class=\"vd-card\" style=\"padding:18px\"><div style=\"font-size:15px;font-weight:500;margin-bottom:8px\">Team workload<\u002Fdiv>\n          <sc-for list=\"{{ repRows }}\" as=\"r\" hint-placeholder-count=\"4\"><div style=\"display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px\"><span style=\"width:110px;padding-left:36px\">{{ r.name }}<\u002Fspan><div style=\"flex:1;height:7px;border-radius:4px;background:#eee\"><div style=\"height:7px;border-radius:4px;background:#7c5cf0;width:{{ r.actW }}\"><\u002Fdiv><\u002Fdiv><span style=\"width:110px;text-align:right;font-size:12px\">{{ r.st.active }} open · {{ r.hrs }}h<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div class=\"vd-card\" style=\"padding:18px\"><div style=\"font-size:15px;font-weight:500;margin-bottom:8px\">Project performance <span style=\"font-size:11px;color:#9a9aa5;font-weight:400\">task-count<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ repProj }}\" as=\"p\" hint-placeholder-count=\"3\"><div style=\"display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px\"><span style=\"width:130px\">{{ p.name }}<br><span style=\"font-size:10.5px;color:#9a9aa5\">Effort-weighted {{ p.wpct }}<\u002Fspan><\u002Fspan><div style=\"flex:1;height:7px;border-radius:4px;background:#eee\"><div style=\"height:7px;border-radius:4px;background:{{ p.col }};width:{{ p.pct }}\"><\u002Fdiv><\u002Fdiv><span style=\"width:90px;text-align:right;font-size:12px\">{{ p.d }}/{{ p.n }} · {{ p.pct }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div class=\"vd-card\" style=\"padding:18px\"><div style=\"font-size:15px;font-weight:500;margin-bottom:8px\">Overdue analysis<\u002Fdiv>\n          <sc-for list=\"{{ repOver }}\" as=\"t\" hint-placeholder-count=\"2\"><div sc-camel-on-click=\"{{ t.open }}\" class=\"vd-row\" style=\"padding:8px 4px;border-top:1px solid #f0f0f3;font-size:12.5px;cursor:pointer\"><b style=\"font-weight:500\">{{ t.title }}<\u002Fb><div style=\"color:#dc2626;font-size:11.5px\">{{ t.dueLabel }} · {{ t.assigneeName }} · {{ t.projName }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n          <div style=\"display:{{ noOver }};font-size:12.5px;color:#9a9aa5\">No overdue tasks.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ isSet }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"vd-2\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start\">\n      <div class=\"vd-card\" style=\"padding:18px;display:grid;gap:12px;font-size:12px;color:#6b6b76\"><div style=\"font-size:15px;font-weight:500;color:#17171c\">General and delegation<\u002Fdiv>\n        <label>Timezone<sc-raw-select class=\"vd-in\" name=\"tz\" value=\"{{ S.tz }}\" sc-camel-on-change=\"{{ sett }}\"><sc-for list=\"{{ tzs }}\" as=\"z\" hint-placeholder-count=\"3\"><option>{{ z }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n        <label style=\"display:flex;gap:8px;align-items:center\"><input type=\"checkbox\" name=\"accept\" checked=\"{{ S.accept }}\" sc-camel-on-change=\"{{ sett }}\">Require assignees to accept tasks (Awaiting acceptance)<\u002Flabel>\n        <label style=\"display:flex;gap:8px;align-items:center\"><input type=\"checkbox\" name=\"review\" checked=\"{{ S.review }}\" sc-camel-on-change=\"{{ sett }}\">Review-first voice mode (off = auto-save when nothing is ambiguous)<\u002Flabel>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\"><label style=\"grid-column:1/-1\">Voice interpreter<sc-raw-select class=\"vd-in\" name=\"interp\" value=\"{{ S.interp }}\" sc-camel-on-change=\"{{ sett }}\"><option value=\"\">Built-in (works offline)<\u002Foption><option value=\"claude\">Claude inside claude.ai only<\u002Foption><option value=\"endpoint\">Claude via my server (works anywhere)<\u002Foption><\u002Fsc-raw-select><\u002Flabel><label style=\"grid-column:1/-1\">AI server address (used with \"via my server\")<input class=\"vd-in\" name=\"aiUrl\" placeholder=\"http://localhost:8787/interpret\" value=\"{{ S.aiUrl }}\" sc-camel-on-change=\"{{ sett }}\"><\u002Flabel><label>Work starts<input class=\"vd-in\" type=\"time\" name=\"workStart\" value=\"{{ S.workStart }}\" sc-camel-on-change=\"{{ sett }}\"><\u002Flabel><label>Work ends<input class=\"vd-in\" type=\"time\" name=\"workEnd\" value=\"{{ S.workEnd }}\" sc-camel-on-change=\"{{ sett }}\"><\u002Flabel><\u002Fdiv><\u002Fdiv>\n      <div class=\"vd-card\" style=\"padding:18px;display:grid;gap:12px;font-size:12px;color:#6b6b76\"><div style=\"font-size:15px;font-weight:500;color:#17171c\">Voice and notifications<\u002Fdiv>\n        <div>Times used for vague phrases. Leave blank to be asked each time.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\"><label>Morning<input class=\"vd-in\" type=\"time\" name=\"morning\" value=\"{{ S.morning }}\" sc-camel-on-change=\"{{ sett }}\"><\u002Flabel><label>Afternoon<input class=\"vd-in\" type=\"time\" name=\"afternoon\" value=\"{{ S.afternoon }}\" sc-camel-on-change=\"{{ sett }}\"><\u002Flabel><label>Lunch<input class=\"vd-in\" type=\"time\" name=\"lunch\" value=\"{{ S.lunch }}\" sc-camel-on-change=\"{{ sett }}\"><\u002Flabel><label>Evening<input class=\"vd-in\" type=\"time\" name=\"evening\" value=\"{{ S.evening }}\" sc-camel-on-change=\"{{ sett }}\"><\u002Flabel><label>Quiet hours from<input class=\"vd-in\" type=\"time\" name=\"quietFrom\" value=\"{{ S.quietFrom }}\" sc-camel-on-change=\"{{ sett }}\"><\u002Flabel><label>Quiet hours to<input class=\"vd-in\" type=\"time\" name=\"quietTo\" value=\"{{ S.quietTo }}\" sc-camel-on-change=\"{{ sett }}\"><\u002Flabel><\u002Fdiv><\u002Fdiv>\n      <div class=\"vd-card\" style=\"padding:18px;font-size:12.5px;color:#55555f;line-height:1.6\"><div style=\"font-size:15px;font-weight:500;color:#17171c;margin-bottom:6px\">Data and connection<\u002Fdiv>Everything here is saved in this browser (local storage) and survives reloads. Members, tasks, projects, voice history and notifications are fully editable.<br>To share across a team and send real reminders, connect a backend: sign-in, a Postgres database, a scheduled job for reminders, and a speech/AI API key held server-side. The task and voice logic here is written to move over unchanged.\n        <div style=\"display:flex;gap:8px;margin-top:12px\"><button sc-camel-on-click=\"{{ exportJson }}\" style=\"border:1px solid #e4e4ea;background:#fff;border-radius:10px;padding:8px 12px;font-size:12px\">Download backup (JSON)<\u002Fbutton><button sc-camel-on-click=\"{{ resetData }}\" style=\"border:1px solid #fecaca;color:#dc2626;background:#fff;border-radius:10px;padding:8px 12px;font-size:12px\">Reset to demo data<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n      <div class=\"vd-card\" style=\"padding:18px;font-size:12.5px;color:#55555f;line-height:1.7\"><div style=\"font-size:15px;font-weight:500;color:#17171c;margin-bottom:6px\">Roles<\u002Fdiv>Owner · Admin · Manager · Member · Viewer. Set per member in Team Members. Server-side enforcement needs the backend.<\u002Fdiv>\n    <\u002Fdiv><\u002Fsc-if>\n    <!--V-->\n  <\u002Fmain>\n<\u002Fdiv>\n<div class=\"vd-bot\" style=\"position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee;padding:8px 10px 14px;justify-content:space-around;align-items:center;z-index:30\">\n  <sc-for list=\"{{ botNav }}\" as=\"n\" hint-placeholder-count=\"5\"><div sc-camel-on-click=\"{{ n.go }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;min-width:56px;padding:4px;color:{{ n.fg }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ n.d }}\"><\u002Fpath><\u002Fsvg>{{ n.label }}<\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div sc-camel-on-click=\"{{ goVoiceMic }}\" style=\"position:fixed;right:26px;bottom:26px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#b49cff,#7c5cf0);display:{{ fabDisp }};place-items:center;cursor:pointer;box-shadow:0 8px 24px #7c5cf055;z-index:25\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<sc-if value=\"{{ hasDrawer }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:#17171c33\" sc-camel-on-click=\"{{ dClose }}\">\n  <div class=\"vd-drawer\" sc-camel-on-click=\"{{ stopP }}\" style=\"width:480px;max-width:100%;background:#fff;height:100%;overflow-y:auto;padding:22px;box-shadow:-8px 0 30px #0000001a\">\n    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:14px\"><span style=\"font-size:12px;color:#9a9aa5;flex:1\">Task details · saved automatically<\u002Fspan><button sc-camel-on-click=\"{{ dClose }}\" style=\"border:0;background:#f1f1f4;border-radius:9px;width:32px;height:32px;font-size:16px\">×<\u002Fbutton><\u002Fdiv>\n    <fieldset disabled=\"{{ dLock }}\" style=\"border:0;padding:0;margin:0;min-width:0\"><input class=\"vd-in\" name=\"title\" value=\"{{ d.title }}\" sc-camel-on-change=\"{{ dset }}\" style=\"font-size:18px;font-weight:500;border-color:transparent;padding:8px 0\">\n    <textarea class=\"vd-in\" name=\"desc\" rows=\"3\" placeholder=\"Add a description\" sc-camel-on-change=\"{{ dset }}\" style=\"margin:8px 0 14px;resize:vertical\">{{ d.desc }}<\u002Ftextarea>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;color:#6b6b76\">\n      <label>Assignee<sc-raw-select class=\"vd-in\" name=\"assignee\" value=\"{{ d.assignee }}\" sc-camel-on-change=\"{{ dset }}\"><option value=\"\">Unassigned<\u002Foption><sc-for list=\"{{ memOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n      <label>Reviewer<sc-raw-select class=\"vd-in\" name=\"reviewer\" value=\"{{ d.reviewer }}\" sc-camel-on-change=\"{{ dset }}\"><option value=\"\">None<\u002Foption><sc-for list=\"{{ memOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n      <label>Project<sc-raw-select class=\"vd-in\" name=\"projectId\" value=\"{{ d.projectId }}\" sc-camel-on-change=\"{{ dset }}\"><option value=\"\">None<\u002Foption><sc-for list=\"{{ projOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n      <label>Status<sc-raw-select class=\"vd-in\" name=\"status\" value=\"{{ d.status }}\" sc-camel-on-change=\"{{ dset }}\"><option value=\"draft\">Draft<\u002Foption><option value=\"todo\">To Do<\u002Foption><option value=\"progress\">In Progress<\u002Foption><option value=\"blocked\">Blocked<\u002Foption><option value=\"done\">Completed<\u002Foption><option value=\"cancelled\">Cancelled<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n      <label>Priority<sc-raw-select class=\"vd-in\" name=\"priority\" value=\"{{ d.priority }}\" sc-camel-on-change=\"{{ dset }}\"><option>Urgent<\u002Foption><option>High<\u002Foption><option>Medium<\u002Foption><option>Low<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n      <label>Due date<input class=\"vd-in\" type=\"date\" name=\"due\" value=\"{{ d.due }}\" sc-camel-on-change=\"{{ dset }}\"><\u002Flabel>\n      <label>Due time<input class=\"vd-in\" type=\"time\" name=\"time\" value=\"{{ d.time }}\" sc-camel-on-change=\"{{ dset }}\"><\u002Flabel>\n      <label>Estimated effort (hours)<input class=\"vd-in\" type=\"number\" min=\"0\" step=\"0.5\" name=\"effort\" value=\"{{ d.effort }}\" sc-camel-on-change=\"{{ dset }}\"><\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"margin:16px 0 4px;font-size:12px;color:#6b6b76;display:flex;justify-content:space-between\"><span>Progress {{ d.pg }}%<\u002Fspan><span>{{ dSubNote }}<\u002Fspan><\u002Fdiv>\n    <div style=\"height:7px;border-radius:4px;background:#eee\"><div style=\"height:7px;border-radius:4px;background:{{ d.stFg }};width:{{ d.pgW }}\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:{{ dProgDisp }};margin-top:8px\"><input type=\"range\" min=\"0\" max=\"99\" name=\"progress\" value=\"{{ d.progress }}\" sc-camel-on-change=\"{{ dset }}\" style=\"width:100%\"><\u002Fdiv>\n    <div style=\"font-size:13px;font-weight:600;margin:20px 0 8px\">Subtasks<\u002Fdiv>\n    <sc-for list=\"{{ dSubs }}\" as=\"s\" hint-placeholder-count=\"0\"><div style=\"display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px\"><input type=\"checkbox\" checked=\"{{ s.d }}\" sc-camel-on-change=\"{{ s.tg }}\"><span style=\"flex:1;color:{{ s.tf }};text-decoration:{{ s.td }}\">{{ s.t }}<\u002Fspan><a sc-camel-on-click=\"{{ s.del }}\" style=\"cursor:pointer;color:#9a9aa5\">remove<\u002Fa><\u002Fdiv><\u002Fsc-for>\n    <div style=\"display:flex;gap:6px;margin-top:6px\"><input class=\"vd-in\" name=\"sub\" placeholder=\"Add subtask\" value=\"{{ f.sub }}\" sc-camel-on-change=\"{{ fld }}\"><button sc-camel-on-click=\"{{ addSub }}\" style=\"border:0;background:#17171c;color:#fff;border-radius:10px;padding:0 14px\">Add<\u002Fbutton><\u002Fdiv>\n    <div style=\"font-size:13px;font-weight:600;margin:20px 0 8px\">Attachments<\u002Fdiv>\n    <sc-for list=\"{{ dAtt }}\" as=\"a\" hint-placeholder-count=\"0\"><div style=\"display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px\"><span style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ a.name }} <span style=\"color:#9a9aa5;font-size:11.5px\">{{ a.kb }}<\u002Fspan><\u002Fspan><a href=\"{{ a.href }}\" download=\"{{ a.name }}\" style=\"display:{{ a.hd }}\">download<\u002Fa><span style=\"display:{{ a.nd }};font-size:11px;color:#9a9aa5\">name only<\u002Fspan><a sc-camel-on-click=\"{{ a.rm }}\" style=\"cursor:pointer;color:#9a9aa5\">remove<\u002Fa><\u002Fdiv><\u002Fsc-for>\n    <input type=\"file\" sc-camel-on-change=\"{{ addFile }}\" style=\"font-size:12px;margin-top:4px\">\n    <div style=\"font-size:13px;font-weight:600;margin:20px 0 8px\">Dependencies <span style=\"font-weight:400;color:#9a9aa5\">(this task waits for)<\u002Fspan><\u002Fdiv>\n    <sc-for list=\"{{ dDeps }}\" as=\"x\" hint-placeholder-count=\"0\"><div style=\"display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px\"><span style=\"flex:1\">{{ x.title }}<\u002Fspan><span style=\"font-size:11.5px;color:{{ x.fg }}\">{{ x.st }}<\u002Fspan><a sc-camel-on-click=\"{{ x.rm }}\" style=\"cursor:pointer;color:#9a9aa5\">remove<\u002Fa><\u002Fdiv><\u002Fsc-for>\n    <sc-raw-select class=\"vd-in\" value=\"\" sc-camel-on-change=\"{{ addDep }}\" style=\"margin-top:4px\"><option value=\"\">Add dependency…<\u002Foption><sc-for list=\"{{ depOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n    <div style=\"font-size:13px;font-weight:600;margin:20px 0 8px\">Comments<\u002Fdiv>\n    <sc-for list=\"{{ dCms }}\" as=\"c\" hint-placeholder-count=\"0\"><div style=\"background:#f7f6fb;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:12.5px\"><b>{{ c.by }}<\u002Fb> <span style=\"color:#9a9aa5\">{{ c.when }}<\u002Fspan><div>{{ c.t }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n    <div style=\"display:flex;gap:6px\"><input class=\"vd-in\" name=\"cm\" placeholder=\"Write a comment\" value=\"{{ f.cm }}\" sc-camel-on-change=\"{{ fld }}\"><button sc-camel-on-click=\"{{ addCm }}\" style=\"border:0;background:#7c5cf0;color:#fff;border-radius:10px;padding:0 14px\">Post<\u002Fbutton><\u002Fdiv>\n    <div style=\"display:{{ dFollowDisp }};gap:8px;margin-top:20px\"><button sc-camel-on-click=\"{{ follow }}\" style=\"border:1px solid #c4b5fd;color:#6d4ce0;background:#fff;border-radius:11px;padding:9px 14px;font-size:12.5px\">Follow up<\u002Fbutton><button sc-camel-on-click=\"{{ reqUp }}\" style=\"border:1px solid #c4b5fd;color:#6d4ce0;background:#fff;border-radius:11px;padding:9px 14px;font-size:12.5px\">Request update<\u002Fbutton><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-top:14px;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ dDone }}\" style=\"border:0;background:#16a34a;color:#fff;border-radius:11px;padding:10px 16px;font-size:13px\">{{ dDoneLabel }}<\u002Fbutton><button sc-camel-on-click=\"{{ dArch }}\" style=\"border:1px solid #e4e4ea;background:#fff;border-radius:11px;padding:10px 16px;font-size:13px\">{{ dArchLabel }}<\u002Fbutton><button sc-camel-on-click=\"{{ dDel }}\" style=\"border:1px solid #fecaca;background:#fff;color:#dc2626;border-radius:11px;padding:10px 16px;font-size:13px;margin-left:auto\">Delete<\u002Fbutton><\u002Fdiv>\n    <\u002Ffieldset>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ showTask }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:60;background:#17171c55;display:grid;place-items:center;padding:16px\" sc-camel-on-click=\"{{ closeModal }}\">\n  <div sc-camel-on-click=\"{{ stopP }}\" style=\"background:#fff;border-radius:20px;padding:22px;width:480px;max-width:100%;max-height:92vh;overflow-y:auto\">\n    <div style=\"font-size:18px;font-weight:500;margin-bottom:14px\">New task<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;color:#6b6b76\">\n      <label style=\"grid-column:1/3\">Title<input class=\"vd-in\" name=\"title\" value=\"{{ f.title }}\" sc-camel-on-change=\"{{ fld }}\" placeholder=\"What needs to be done?\"><\u002Flabel>\n      <label>Assignee<sc-raw-select class=\"vd-in\" name=\"assignee\" value=\"{{ f.assignee }}\" sc-camel-on-change=\"{{ fld }}\"><option value=\"\">Unassigned (draft)<\u002Foption><sc-for list=\"{{ memOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n      <label>Project<sc-raw-select class=\"vd-in\" name=\"projectId\" value=\"{{ f.projectId }}\" sc-camel-on-change=\"{{ fld }}\"><option value=\"\">None<\u002Foption><sc-for list=\"{{ projOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n      <label>Due date<input class=\"vd-in\" type=\"date\" name=\"due\" value=\"{{ f.due }}\" sc-camel-on-change=\"{{ fld }}\"><\u002Flabel>\n      <label>Due time<input class=\"vd-in\" type=\"time\" name=\"time\" value=\"{{ f.time }}\" sc-camel-on-change=\"{{ fld }}\"><\u002Flabel>\n      <label>Priority<sc-raw-select class=\"vd-in\" name=\"priority\" value=\"{{ f.priority }}\" sc-camel-on-change=\"{{ fld }}\"><option>Urgent<\u002Foption><option>High<\u002Foption><option>Medium<\u002Foption><option>Low<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"display:{{ fErrDisp }};color:#dc2626;font-size:12.5px;margin-top:10px\">{{ f.err }}<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;justify-content:flex-end;margin-top:18px\"><button sc-camel-on-click=\"{{ closeModal }}\" style=\"border:1px solid #e4e4ea;background:#fff;border-radius:11px;padding:10px 16px;font-size:13px\">Cancel<\u002Fbutton><button sc-camel-on-click=\"{{ createTask }}\" style=\"border:0;background:#17171c;color:#fff;border-radius:11px;padding:10px 18px;font-size:13px\">Create task<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ showMember }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:60;background:#17171c55;display:grid;place-items:center;padding:16px\" sc-camel-on-click=\"{{ closeModal }}\">\n  <div sc-camel-on-click=\"{{ stopP }}\" style=\"background:#fff;border-radius:20px;padding:22px;width:560px;max-width:100%;max-height:92vh;overflow-y:auto\">\n    <div style=\"font-size:18px;font-weight:500;margin-bottom:14px\">Team member<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;font-size:12px;color:#6b6b76\">\n      <label>Full name<input class=\"vd-in\" name=\"name\" value=\"{{ f.name }}\" sc-camel-on-change=\"{{ fld }}\"><\u002Flabel>\n      <label>Display name<input class=\"vd-in\" name=\"disp\" value=\"{{ f.disp }}\" sc-camel-on-change=\"{{ fld }}\"><\u002Flabel>\n      <label>Work email<input class=\"vd-in\" name=\"email\" value=\"{{ f.email }}\" sc-camel-on-change=\"{{ fld }}\"><\u002Flabel>\n      <label>Mobile<input class=\"vd-in\" name=\"phone\" value=\"{{ f.phone }}\" sc-camel-on-change=\"{{ fld }}\"><\u002Flabel>\n      <label>Department<input class=\"vd-in\" name=\"dept\" value=\"{{ f.dept }}\" sc-camel-on-change=\"{{ fld }}\"><\u002Flab
